# DEMOWALL · Netlify configuration

[build]
  publish = "."
  functions = "netlify/functions"

# Serve functions behind clean /api paths
[[redirects]]
  from = "/api/demos"
  to = "/.netlify/functions/demos"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

# Site-wide security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://i.ytimg.com https://img.youtube.com; media-src 'self' https://i.ytimg.com; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Never cache the admin panel or API responses
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"